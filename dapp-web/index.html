<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Android DApp (Sepolia)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body { font-family: sans-serif; padding: 16px; }
        button { padding: 10px 14px; margin: 6px 0; }
        input { width: 100%; padding: 10px; margin: 6px 0; }
        pre { background: #f6f6f6; padding: 10px; min-height: 120px; }
    </style>
</head>
<body>
<h2>Android DApp (Sepolia)</h2>

<button id="connect">Connect Wallet</button>
<div id="account"></div>
<div id="balance"></div>

<hr />

<input id="to" placeholder="Send to address (0x...)" />
<input id="amount" placeholder="Amount (ETH)" />
<button id="send">Send</button>

<pre id="log"></pre>

<script type="module" src="./main.js"></script>
</body>
</html>
